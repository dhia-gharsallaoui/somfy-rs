[package]
name = "somfy-ota"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "no_std ESP-IDF app-image verification and over-the-air update policy for somfy-rs"

[dependencies]
# The captured version and project name out of the app descriptor, and nothing
# else. Two `String<32>`s, because the descriptor's own fields are 32 bytes and
# a caller that wanted to print them would otherwise be handed a slice into a
# buffer this crate does not keep — the bytes arrive in a stream and are gone
# by the time anybody asks.
heapless = "0.8"
