[package]
name = "somfy-ota"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "no_std ESP-IDF app-image verification and over-the-air update policy for somfy-rs"

[dependencies]
# The captured version and project name out of the app descriptor, and nothing
# else. Two `String<32>`s, because the descriptor's own fields are 32 bytes and
# a caller that wanted to print them would otherwise be handed a slice into a
# buffer this crate does not keep — the bytes arrive in a stream and are gone
# by the time anybody asks.
heapless = "0.8"
# The image's own appended SHA-256, verified here rather than left to the
# bootloader — `src/image.rs` carries the reversal and what it costs.
#
# The reference `no_std` SHA-256, and about as adopted as a Rust crate gets:
# 849,109,416 downloads (222,982,331 recent), MIT OR Apache-2.0 with both
# LICENSE files in the published crate, on `RustCrypto/hashes` (2,255 stars, 334
# forks, 34 open issues, last push 2026-08-11). `default-features = false` drops
# its `std` default; nothing else is wanted, and on Xtensa there is
# no assembly backend to choose between — `cpufeatures` is an x86/aarch64-only
# dependency and is not in this graph.
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
# The fixtures assemble images the way the flashing tool does, which now
# includes hashing them. Same version as above, so there is one copy.
sha2 = { version = "0.11", default-features = false }
