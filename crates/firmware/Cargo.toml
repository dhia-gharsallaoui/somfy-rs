[package]
name = "firmware"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "somfy-rs ESP32 firmware"
# Spelled out rather than inherited: this crate is excluded from the root
# workspace (it builds only for ESP targets), so `*.workspace = true` is
# unavailable here. Keep in step with [workspace.package] in the root manifest.
repository = "https://github.com/dhia-gharsallaoui/somfy-rs"

# This crate is the root of its own workspace, stated rather than inferred.
#
# The root manifest's `exclude = ["crates/firmware"]` only says "not a member of
# *that* workspace"; cargo then keeps walking upwards, and it used to find
# nothing simply because no `Cargo.toml` sits above the repository root. That
# held until a checkout appeared *inside* another one — a git worktree under
# `.claude/worktrees/` — at which point cargo walked past the worktree's own
# root, reached the outer repository's manifest, and refused to build here at
# all ("current package believes it's in a workspace when it's not"). An empty
# table stops the search on this file, so the crate's independence no longer
# depends on where the checkout happens to live.
[workspace]

[[bin]]
name = "firmware"
path = "src/main.rs"
# No test harness for this no_std binary: cargo's default auto-generated
# unittest target links against `std`/`libtest` unconditionally, which does
# not exist for this bare-metal target (build-std = ["core"] only, below).
# Host-side unit tests belong in a separate lib target, built for the host
# triple rather than the chip target, once this crate has logic worth
# testing that way.
test = false

# Flash-only bring-up harness for the rolling-code store: no SPI, no RMT,
# nothing on the air. It is a second binary rather than a branch inside
# `firmware` precisely so that proving the store survives a power cycle never
# involves keying a transmitter. `test = false` for the same reason as above.
[[bin]]
name = "store-check"
path = "src/bin/store_check.rs"
test = false

# Config-region bring-up harness: mounts `wificfg`, surveys it, writes a
# placeholder credential and reads it back. No radio, no network, and no way
# to make it store a real credential — the host-side `provision` example does
# that. `test = false` for the same reason as above.
[[bin]]
name = "config-check"
path = "src/bin/config_check.rs"
test = false

# Transmit bring-up harness: the only image here that keys the radio by itself,
# and it does so at a synthetic address. Separate from `firmware` so that
# flashing the controller can never put a frame on the band on its own.
# `test = false` for the same reason as above.
[[bin]]
name = "tx-check"
path = "src/bin/tx_check.rs"
test = false

[build-dependencies]
# Parses `partitions.csv` at build time so `build.rs` can assert the layout's
# invariants. **This is the same parser espflash uses**, which is the whole
# reason to take a dependency rather than split a nine-line file on commas: the
# build asserts what the flashing tool will actually see, not a second reading
# of the same file that could drift from it. It brings the generic rules with it
# — 64 KB alignment for app partitions, `data, ota` sized exactly 0x2000,
# overlaps, duplicate names — and leaves `build.rs` only the project-specific
# ones. esp-rs's own crate; 1,013,458 downloads (317,455 recent), MIT OR
# Apache-2.0, last release 2025-04-16. A build dependency, so it is compiled for
# the host and none of it reaches the image.
esp-idf-part = "0.6"
# Compresses `ui/dist/` into the image. A build dependency, so none of it is
# linked into the firmware — the device never inflates anything, it serves the
# bytes this produced. The reference for "the standard Rust DEFLATE crate":
# 620,040,372 downloads (137,601,615 recent), MIT OR Apache-2.0, last release
# 2026-02-03, and it lives under `rust-lang/`. `default-features = false` plus
# `rust_backend` keeps it off `libz`/`zlib-ng`, so building this crate needs no
# C toolchain and no system library — which matters because the chip targets
# already bring their own.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

[dependencies]
esp-hal = { version = "1.1.1", features = ["unstable"] }
# The lock the log ring and the panic record are read and written under. Already
# in this image several times over — `esp-hal`, `esp-println` and `esp-storage`
# each take one — so this declares a dependency that was always linked rather
# than adding one. Named directly because `crate::diag` calls
# `critical_section::with` itself, and reaching it through another crate's
# re-export would tie this module to whichever version that crate resolved.
critical-section = "1.2"
# The checksum on both RTC-memory records. `CRC_32_ISO_HDLC`, which is what all
# four flash records already use, so a reader meets one algorithm in this
# codebase rather than two. Already in the dependency graph through
# `somfy-store` and `somfy-config`; `crate::diag` uses its `NoTable` variant, so
# this adds no second 1 KiB lookup table to the image.
crc = "3"
esp-println = { version = "0.13", features = ["log"] }
heapless = "0.8"
embedded-hal = "1.0"
# `ExclusiveDevice` needs a real `DelayNs` here, not `new_no_delay`: the CC1101
# reset sequence holds chip select across a delay *inside* the SPI transaction,
# and the no-delay constructor panics on exactly that.
embedded-hal-bus = "0.3"
# Supplies the `esp_app_desc!()` macro. Not optional in practice: the ESP-IDF
# second-stage bootloader expects an application descriptor in the image, and
# espflash 4.x refuses to flash a binary without one. Without this the firmware
# compiles and links perfectly and simply cannot be put on a device.
esp-bootloader-esp-idf = "0.5"
# Raw access to the on-board SPI NOR flash, as `embedded-storage` traits. The
# rolling-code store needs word-granular writes and sector erases, which is
# exactly what these expose and what an ESP-IDF NVS-style API would hide.
esp-storage = "0.9"
embedded-storage = "0.3"
somfy-rts = { path = "../somfy-rts" }
somfy-rmt = { path = "../somfy-rmt" }
somfy-cc1101 = { path = "../somfy-cc1101" }
somfy-store = { path = "../somfy-store" }
somfy-domain = { path = "../somfy-domain" }
# The two task bodies and the channels between them. Everything in there is
# host-tested; what is left in this crate is an executor, two `#[task]`
# wrappers, and the implementations of the traits those bodies are written
# against.
somfy-tasks = { path = "../somfy-tasks" }
# The persisted Wi-Fi credentials: validation and the record's bytes, host-
# tested. This crate keeps only the flash I/O, exactly as it does for
# `somfy-store`.
somfy-config = { path = "../somfy-config", features = ["migrate"] }
# The `RTSB` container this device exports and reads back: what is in it, what
# is deliberately not (the two secrets), and the checksum. Everything decided
# there is host-tested there; what is left here is streaming it out of flash and
# writing it back in.
somfy-backup = { path = "../somfy-backup" }
# The C++ ESPSomfy-RTS backup parser, reached through `somfy-config`'s `migrate`
# feature above — and named here for one type, `MigrateError`, which
# `crate::restore` matches on to tell "a version this build does not read" from
# "not a backup at all".
#
# **This is new, and it is a reversal.** That crate's manifest used to say the
# device had no reason to carry a parser for a file it will never see. It does
# now: a restore stages a backup in flash and the boot path reads it, because
# boot is the only place on this device with sixteen kilobytes of stack free to
# parse one in. See `crate::restore`.
somfy-migrate = { path = "../somfy-migrate" }
# What an update decides: whether an upload is a firmware image for this chip,
# what to do about the `otadata` state this image booted with, and which
# self-test legs may refuse a release. All host-tested there; what is left here
# is flash addressing and one thirty-two byte record. Not optional and not
# feature-gated: the *upload* half needs a web server, but the boot-side
# roll-back is what keeps a bad release from being permanent and it belongs on
# every chip that has an `otadata` region.
somfy-ota = { path = "../somfy-ota" }
# Topic construction, config validation, HA discovery payloads, and the
# lifecycle plans this crate's broker session executes. Everything decided
# there is host-tested there; what is left here is the transport.
somfy-mqtt = { path = "../somfy-mqtt", optional = true }
# The MQTT client. Chosen from a survey of all 230 `mqtt`-keyword crates with
# every no_std client's source read — see CLAUDE.md's evaluation table. It is
# alloc-free with zero `unsafe` in its source, takes caller-owned fixed rx/tx
# slices, advertises the rx size as MQTT5 `MaximumPacketSize` so inbound is
# bounded by construction, and drives keepalive itself. `default-features =
# false` drops its `defmt` default: this firmware logs through `esp-println`,
# and a second logging framework would pull `defmt` and its transport into the
# image for output nothing here reads.
minimq = { version = "0.13", default-features = false, optional = true }
# Embassy, by way of `esp-rtos`. NOT `esp-hal-embassy`: that crate's
# `executors` feature turns on `esp-hal/__esp_hal_embassy`, a feature esp-hal
# dropped in 1.0.0-rc.1, so no published version of it resolves against the
# esp-hal this crate uses. `esp-rtos` is its replacement and supplies both the
# time driver and the thread-mode executor. The executor and time crates are
# pinned to the majors it depends on, because a second semver-incompatible
# copy of `embassy-time` in one image is two unrelated clocks, not a warning.
embassy-executor = "0.10"
embassy-time = "0.5"
# `select3` for the state task's three inputs, and `yield_now` for handing the
# executor to the radio task the moment a transmission is queued.
embassy-futures = "0.1"
#
# `esp-radio` here is not optional decoration: it is the feature that makes
# `esp-rtos` register itself as the preemptive scheduler the Wi-Fi driver
# creates its tasks on, and `esp-alloc` is what makes those task stacks come
# out of the heap this crate installs rather than a second one. Without them
# `esp_radio::wifi::new` has nowhere to put the driver's threads.
esp-rtos = { version = "0.3", features = ["embassy", "esp-alloc", "esp-radio"] }
# Must match `somfy-tasks` and `esp-hal`: the channel types cross both
# boundaries, so a second copy would be a type mismatch at the seam between
# the tasks rather than a duplicate-dependency warning.
embassy-sync = "0.8"
# Wi-Fi. `esp-radio`, not `esp-wifi`: `esp-wifi 0.15` will not resolve against
# our `esp-hal 1.1.2` at all, while `esp-radio` continues the same version line
# after the rename and lives in the esp-hal repo. See CLAUDE.md's evaluation
# table. `default-features = false` drops nothing we want — the default is
# `esp-alloc`, which is re-enabled below alongside `wifi`.
esp-radio = { version = "0.18", default-features = false, features = [
    "esp-alloc",
    "wifi",
] }
# The heap, and it exists for `esp-radio` alone. `internal-heap-stats` is what
# turns "the heap is big enough" from an assertion into a measurement: it keeps
# a high-water mark, which `heap::report` prints and the broker session
# publishes. Nothing on the radio path allocates, so it costs that path nothing
# — but "a few instructions per allocation" undersells it elsewhere: an
# associated link runs about 30,000 bytes a second through this allocator with
# no application traffic at all, and every one of those allocations and frees
# takes a critical section that these counters make slightly longer.
# `src/heap.rs` carries the measurement and the argument that it is affordable.
esp-alloc = { version = "0.10", features = ["internal-heap-stats"] }
# The TCP/IP stack. `dhcpv4` for the address, `proto-ipv4` for the traffic;
# no IPv6. `dns`, `udp` and `multicast` are **not** here: each has exactly one
# consumer, so each is turned on by that consumer's feature below rather than
# unconditionally. That matters for more than tidiness — `dns` makes
# `embassy_net::new` add a socket to the set before any of this crate's code
# runs, so a radio-only build would pay for a resolver nothing can call.
#
# The resolver, once `sntp` turns it on, is also what makes
# `somfy_config::MqttSettings`'s broker able to become a hostname: that is a
# field change and one call to `net::resolve`, rather than a feature flag and a
# socket budget.
# `embassy-net`'s `StackResources` has to outlive the stack that borrows it,
# which means a `'static` it is handed exactly once. `StaticCell` is the
# no_std idiom for that and it is by embassy's own author; the alternative is
# a `static mut` plus an `unsafe` block asserting single use, which is the
# same guarantee with the check removed. 3 KB of code, MIT/Apache-2.0, and
# nothing else in the workspace needs it.
static_cell = "2"
# The web server and its WebSocket. Chosen over `edge-http`/`edge-ws` — see
# CLAUDE.md's evaluation table — and both were proved to build for
# `xtensa-esp32s3-none-elf` and `riscv32imc-unknown-none-elf` under
# `build-std = ["core"]` before either was adopted. `default-features = false`
# drops its `alloc` default: nothing on the request path allocates, and the heap
# this image carries belongs to `esp-radio`.
#
# `embassy` supplies the `TcpSocket` listener and the timer; `json` supplies
# `SocketTx::send_json` and the `Json` extractor over `serde-json-core`; `ws` is
# the WebSocket. No `defmt` and no `log`: this firmware logs through
# `esp-println`, and a second framework would pull its transport into the image
# for output nothing here reads.
picoserve = { version = "0.19", default-features = false, optional = true, features = [
    "embassy",
    "json",
    "ws",
] }
# JSON in and out of fixed slices, with no allocator. Pinned to the same major
# `picoserve` depends on so there is one copy: two would be two `Serialize`
# traits, and the DTOs implement one of them.
#
# It is the only `no_std` serde JSON codec with real adoption — 4,129,193
# downloads (486,496 recent), 198 stars, 74 forks, last push 2025-11-18, MIT OR
# Apache-2.0 — and it is what makes the wire shape the *derive* rather than a
# hand-written writer, so `ui/src/api/generated/` and what this device sends
# cannot disagree.
serde-json-core = { version = "0.6", default-features = false, optional = true }
# The `Serialize` bound on this crate's own response types. Same version and
# same `default-features = false` as `somfy-api` pins, so there is one serde.
serde = { version = "1", default-features = false, optional = true }
# The DTOs, their validation, and the status each rejection carries. Everything
# decided there is host-tested there; what is left here is the transport.
somfy-api = { path = "../somfy-api" }
embassy-net = { version = "0.9.1", features = [
    "dhcpv4",
    "medium-ethernet",
    "proto-ipv4",
    "tcp",
] }
# The mDNS responder. Chosen from a sweep of every `mdns`/`dns-sd` crate on
# crates.io — see CLAUDE.md's evaluation table — and proved by building a
# throwaway spike for `xtensa-esp32s3-none-elf` and `riscv32imc-unknown-none-elf`
# against this crate's real dependency set before it was adopted. It is the only
# `no_std` **no-alloc** responder there is, it carries **zero** `unsafe`, and it
# never announces on a timer: its broadcast half waits on a `Signal` this crate
# owns, so every multicast packet this device sends is one `crate::mdns` asked
# for. `default-features = false` + `io` drops its `std` and `log`/`defmt`
# defaults; this firmware logs through `esp-println`.
edge-mdns = { version = "0.8", default-features = false, optional = true, features = [
    "io",
] }
# `edge-mdns`'s socket abstraction, and its `embassy-net` implementation. The
# feature list is spelled out rather than taking its `all` default, which would
# turn on `embassy-net`'s `proto-ipv6`, `icmp`, `dns` and `dhcpv4-hostname` for
# a responder that answers A records over IPv4.
edge-nal = { version = "0.7", optional = true }
edge-nal-embassy = { version = "0.9", default-features = false, optional = true, features = [
    "medium-ethernet",
    "multicast",
    "proto-ipv4",
    "udp",
] }
# `edge-mdns` takes an `rng` for the RFC 6762 §6 response jitter. This is the
# trait crate only; the implementation over `esp_hal::rng::Rng` is four lines in
# `crate::mdns`, because there is no chip RNG adapter for `rand_core` 0.10 in
# the esp-rs stack and a `TryRng` impl is smaller than any crate that would
# carry one.
rand_core = { version = "0.10", default-features = false, optional = true }
# The SNTP client, and its `embassy-net` socket adapter. Also chosen from a full
# crates.io sweep and proved by the same spike. Alloc-free, `unsafe`-free, and
# the adapter speaks to `embassy_net::udp::UdpSocket` directly rather than
# through `embedded-nal-async` — so the trait-version mismatch that eliminated
# two MQTT candidates has no surface here at all.
#
# **Not** `sntpc-time-embassy`, its sibling: see CLAUDE.md. `crate::sntp` supplies
# the `NtpTimestampGenerator` itself, because that trait's `timestamp_sec` is the
# *pivot* `sntpc` reconstructs the NTP era from, and the sibling hardcodes a
# monotonic one with no way to hand it the device's own wall clock.
sntpc = { version = "0.11", default-features = false, optional = true }
sntpc-net-embassy = { version = "0.11", optional = true }

# No [dev-dependencies]: crates like `embedded-hal-mock` assume `std` (they
# don't declare `#![no_std]`), so no feature selection lets them compile for
# this bare-metal target under build-std = ["core"]. Add host-side test
# tooling only once there is a lib target compiled for the host triple.

[features]
# The ordinary build is the full one. A chip feature still has to be named on
# top of these — there is no default chip, and there should not be.
default = ["mqtt", "ui", "mdns", "sntp"]

# The three transports, and **the reason they are features is not size.**
#
# Flash is a non-argument here: the ESP32 image is 632,640 bytes of a 2,031,616
# slot and the whole web UI is 24 KiB gzipped. Two reasons hold.
#
# **They are a structural test of the one design rule this firmware has.** HTTP
# and MQTT must reach the same functions rather than reimplementing each other,
# and a feature gate proves it on every build: if `somfy-domain`, `somfy-tasks`
# and this crate's own state task compile with `mqtt` off, `http` off and both
# off, then no transport logic leaked into the core. A `#[cfg]` that has to
# appear inside `StateMachine`, `ShadeEdit` or `tasks::apply_edit` is not a line
# to write — it is the boundary being in the wrong place. Two of those were
# found by turning these on for the first time, and both were fixed rather than
# gated: `edits.rs` was borrowing `somfy_mqtt::MAX_NAME_LEN` for a constant that
# is the domain's, and the state task's request seam was living inside the HTTP
# module rather than beside the task it belongs to.
#
# **And DRAM used to decide which of them a chip could carry.** That was
# measured, not estimated: the ESP32-C3 had the room for `mqtt`, `http` and `ui`
# but not for `mdns` or `sntp` on top of them, and `heap.rs` refused those two on
# that chip with a `compile_error!` naming the figure. Both refusals are gone
# with the chip (2026-08-19), and the ESP32-S3 carries everything with room to
# spare — see `src/heap.rs`.
mqtt = ["dep:minimq", "dep:somfy-mqtt"]
http = ["dep:picoserve", "dep:serde", "dep:serde-json-core"]
# The UI implies the server, because a UI with nothing to serve it is not a
# configuration anybody wants. The reverse is a real build: `http` without `ui`
# is the API with no browser front end, which is what an integration or a
# `curl`-driven test rig needs and what keeps 100 KB of assets out of an image
# that will never serve them.
ui = ["http"]

# **`mdns` implies `http`, for the same reason `ui` does.** The only thing this
# device offers over `<hostname>.local` is the web server: the broker session
# dials *out*, and there is no other listener in the image. So `mdns` without
# `http` would advertise `_http._tcp` on port 80 to a port nothing is bound to —
# a name that resolves to a connection refused, which is worse than no name at
# all because it looks like a device that has broken rather than one that was
# never there.
#
# The reverse — `http` without `mdns` — is a real build and stays one. It is what
# an integration test rig wants when it already knows the address, and it is what
# a CI row builds so that the responder is proved separable from the server it
# advertises. It was also the ESP32-C3's shipping configuration until that chip
# was dropped on 2026-08-19.
mdns = [
    "http",
    "dep:edge-mdns",
    "dep:edge-nal",
    "dep:edge-nal-embassy",
    "dep:rand_core",
    "embassy-net/multicast",
    "embassy-net/udp",
]

# **`sntp` implies nothing, and that is the point.** Wall-clock time is not a
# transport: no shade command, no position estimate and no rolling code depends
# on it, and `crate::sntp` is the only module in the image that knows what a date
# is. A build with it off has no wall clock at all — which is a stronger
# statement than "nothing reads it", because there is nothing to read.
#
# **The ESP32-C3 used to be such a build**: `sntp` was refused there, so that
# chip had no wall clock at all. That chip is gone (2026-08-19) and the refusal
# with it. An SNTP client is one 48-byte datagram an hour, which is nothing on
# the wire, and 2,880 bytes of DRAM in the image. Nothing this firmware does
# depends on it; log timestamps do, and TLS on a future update path would.
sntp = [
    "dep:sntpc",
    "dep:sntpc-net-embassy",
    "embassy-net/dns",
    "embassy-net/udp",
]

# **Two deliberately broken images, and they exist so the roll-back can be
# proved rather than reasoned about.** `docs/plans/…-plan6-persistence-ota.md`
# is explicit that a self-test which has never failed is a self-test nobody has
# tested, and neither of these can be produced by any combination of the
# features above — a sabotage that a normal build could reach by accident would
# be worse than no test at all.
#
# Neither is in `default`, neither is in the CI matrix, and both say what they
# are on the serial line at boot. `docs/hardware-checklist.md` carries the
# procedure that uses them; `crates/firmware/src/ota/mod.rs` carries the
# mechanism.
#
# **They break different halves.** `bad-image-selftest` fails a *leg*, which the
# soak notices and acts on within its own boot. `bad-image-panic` never reaches
# a verdict at all, which is the harder case: it is caught on the **following**
# boot by the attempt counter in RTC memory, and it is the only way to exercise
# that counter without a hardware fault.
bad-image-selftest = []
bad-image-panic = []

# One chip. It is still a feature rather than a hardcoded dependency list,
# because "which chip" is a real question this crate should keep asking out loud
# — and because `src/chip.rs`'s `compile_error!` gives a bare `cargo build` a
# sentence instead of two dozen macro expansions from esp-metadata-generated.
#
# **Three chips have been dropped, all for the same reason, all recorded in
# `docs/provenance.md` with their arithmetic — and the reason is always that
# none of them had ever booted this firmware.**
#
# The ESP32-S2 went on 2026-08-17: it could not hold the broker session in DRAM,
# and a `mqtt` feature existed solely to compile that session out for it — eight
# `cfg` sites across five files and a stub `start_mqtt` that printed an apology
# at boot. Nothing else ever wanted a build without a broker, because a board
# with no broker *provisioned* is an ordinary runtime state `start_mqtt` handles
# without a feature flag.
#
# The ESP32 went on 2026-08-18. It was already excluded from the web server by a
# `compile_error!`, and its one buildable configuration — `mqtt` alone — left its
# Wi-Fi heap 1,700 bytes above the measured announcement peak, inside that peak's
# own boot-to-boot spread, with nothing smaller to retreat to.
#
# The ESP32-C3 went on 2026-08-19, and it is the same judgement applied
# consistently rather than a new one. Its shipping build cleared the same peak by
# **676 bytes** — against a peak measured on an *ESP32-S3*, since no C3 had ever
# run this firmware to be measured. It had needed three accommodations to stay:
# a `compile_error!` refusing it `mdns`, another refusing it `sntp`, and halved
# `api::TCP_RX_BYTES`/`TCP_TX_BYTES` — and every feature since had cost it again.
#
# **What that cost, said plainly, because it is the real argument against.** The
# C3 was the only RISC-V row, and the RISC-V row caught a fault nothing else
# would have: `AtomicU32::fetch_add` does not exist on `riscv32imc`. Five places
# in this crate use a `blocking_mutex` where an atomic would be natural, and
# `docs/provenance.md` records that they are kept in that shape deliberately
# rather than left with a reason that no longer applies.
chip-s3 = [
    "esp-hal/esp32s3",
    "esp-println/esp32s3",
    "esp-bootloader-esp-idf/esp32s3",
    "esp-storage/esp32s3",
    "esp-rtos/esp32s3",
    "esp-radio/esp32s3",
    "esp-alloc/esp32s3",
]

# **The constraint that forced this is gone, and the setting is kept anyway.**
#
# `esp-storage`'s build script refuses to build below optimization level 2, 3 or
# s — its flash routines run from RAM with the cache disabled and are
# timing-sensitive, so an unoptimized build is not slow, it is wrong. The check
# is `cfg!(feature = "esp32")` and nothing else (`esp-storage-0.9.0/build.rs`),
# so it applied to the plain ESP32 alone, and that chip was dropped on
# 2026-08-18. The default dev profile is level 0, and `cargo clippy` uses the dev
# profile, which is why the lint matrix needed this to run at all.
#
# It stays because removing it is not a simplification: it would change what
# every dev-profile build of this crate compiles, on both remaining chips, in
# exchange for nothing anybody asked for. Should the ESP32 ever come back, this
# is already correct.
[profile.dev]
opt-level = "s"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# `esp-radio` states in its own documentation that it "is necessary to build
# with optimization level 2 or 3 since otherwise, it might not even be able to
# connect". That is a timing constraint on the Rust glue around the closed
# Wi-Fi blob, not a preference — and the failure it describes is a radio that
# associates unreliably, which would be blamed on the network long before it
# was blamed on a profile. Both profiles are pinned rather than just the dev
# one, because `opt-level = "s"` is a size-first setting and the requirement is
# stated in terms of 2 or 3.
[profile.dev.package.esp-radio]
opt-level = 3

[profile.release.package.esp-radio]
opt-level = 3
