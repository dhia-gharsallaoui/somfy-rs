# Editor configuration for this crate. It changes nothing about how the
# firmware is built or tested — only what rust-analyzer passes when it checks.
#
# ## The problem it solves
#
# `src/chip.rs` opens with a `compile_error!` when no `chip-*` feature is
# enabled, because esp-hal has no default chip and a zero-feature build
# otherwise fails inside a dependency with a message that names none of that.
# rust-analyzer checks with no features by default, so it trips the guard and
# greys out the entire crate: the error is correct and the editor is useless.
#
# ## It names the ESP32-S3 because that is the only chip left
#
# It used to name the ESP32-C3, for a good reason that has expired: that chip's
# target, `riscv32imc-unknown-none-elf`, ships with stable Rust, so analysis
# worked out of the box in any shell. The ESP32-C3 was dropped on 2026-08-19
# (see `src/heap.rs`), and the ESP32-S3 is Xtensa.
#
# **So an editor now needs the `esp` toolchain**, and it has to inherit it:
# start the editor from a shell that has run `source ~/export-esp.sh`, or the
# check fails with `error[E0463]: can't find crate for 'core'` — `build-std`
# needs `rust-src` from the `esp` toolchain, which a plain stable install does
# not have. There is no configuration here that avoids that; the friction is
# real and it is the price of the chip this project actually runs on.
#
# ## If your rust-analyzer ignores this file
#
# Per-directory `rust-analyzer.toml` is a relatively recent feature. The
# equivalent editor-side settings are `rust-analyzer.cargo.features` and
# `rust-analyzer.cargo.target`; `README.md` carries a worked example.
cargo.features = ["chip-s3"]
cargo.target = "xtensa-esp32s3-none-elf"
