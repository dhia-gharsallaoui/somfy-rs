# `alloc` is here for `esp-radio` and for nothing else.
#
# Every crate in this workspace is allocation-free, and the six that carry the
# protocol, the domain and the store still are — CI proves it by building each
# of them for `thumbv7em-none-eabihf`, a target with no allocator at all. What
# needs a heap is the Wi-Fi driver: `esp-radio` is `extern crate alloc`, its
# `StationConfig` holds an `alloc::string::String`, and `esp-rtos` allocates the
# driver's task stacks. Without `alloc` in this list the build stops at
# `error[E0463]: can't find crate for 'alloc'`.
#
# `crates/firmware/src/net.rs` documents where the heap lives, how big it is and
# why; `docs/provenance.md` records the measurement behind the size.
[unstable]
build-std = ["core", "alloc"]

[env]
ESP_LOG = "info"

# **No `-Tlinkall.x` here, and that is deliberate.** esp-hal's `rt` feature
# copies a per-chip `linkall.x` into OUT_DIR and adds it to the linker search
# path, and a target normally has to be told to load it. This crate instead
# passes `-Tsomfy-link.x` from `build.rs`, which includes linkall.x's four
# lines itself and inserts one output section — the heap — immediately before
# esp-hal's `.stack`. Loading both scripts would define every memory region
# twice and fail the link. See `build.rs::reserve_stack_and_heap` and
# `src/heap.rs`.
