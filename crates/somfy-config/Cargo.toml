[package]
name = "somfy-config"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "no_std persisted device configuration for somfy-rs — a Plan 5 stopgap that Plan 6 replaces"

[dependencies]
heapless = "0.8"
# The record's validity marker, and the same crate and variant `somfy-store`
# uses for the same reason: telling a torn write from a good one is the whole
# job, and hand-rolling the polynomial, reflection and init/xorout of "CRC-32"
# is the classic way to be subtly and invisibly wrong. A known-answer test
# pins the variant here too, because picking the wrong one out of the
# catalogue is a mistake the dependency cannot prevent.
crc = "3"
# The MQTT topic rules, so a stored `discovery_prefix` or `state_root` is
# checked by the same validators that will build topics from it. Restating them
# here is how the two would drift, and a namespace that the record accepts and
# the topic builder refuses is a device that boots without MQTT and says so
# three flashes after the value was typed.
somfy-mqtt = { path = "../somfy-mqtt" }
# The shade record's fields *are* `somfy_domain::ShadeConfig` — what
# `Registry::add_shade` takes — and its address, name and kind rules are the
# domain's, reached through `ShadeConfig::new` and `ShadeKind::from_raw` rather
# than restated here. A record that decoded to a shade the registry would then
# refuse is a provisioned shade vanishing at boot with a log line to say so.
somfy-domain = { path = "../somfy-domain" }
# `RollingCode`, so the seed a record carries is the same type the store holds
# and there is no bare `u16` anywhere on the path between them.
somfy-rts = { path = "../somfy-rts" }

# The backup parser behind `somfy_config::import`, which recovers a shade table
# and the estate around it — names, addresses, kinds, travel times and the
# next-to-send rolling code — from a file exported by the controller being
# replaced.
#
# **Optional, off by default, and the firmware is what turns it on.** This was
# a dev-dependency until the import moved into the library, on the argument
# that reading a backup is a host-side step and the device "has no reason to
# carry a parser for a file it will never see". That has stopped being true:
# the firmware imports a C++ backup at boot from a staging flash region, so it
# does see one.
#
# What survives of the old argument is the *default*. A board provisioned any
# other way pays nothing for this, because `cargo build -p somfy-config
# --target thumbv7em-none-eabihf` without `--features migrate` builds neither
# the parser nor the module that consumes it — which is why the CI `no_std`
# step now has two rows for this crate rather than one.
#
# The host tools and the firmware then run the **same** importer: one set of
# refusal rules, one set of caveats, and one place the rolling-code `+1`
# contract is applied, rather than a library copy and a tool copy free to
# drift apart on the one field that cannot be corrected afterwards.
somfy-migrate = { path = "../somfy-migrate", optional = true }

[features]
# `somfy_config::import` — reading a C++ backup into the two records this crate
# writes. Off by default; the dependency comment above says why the default is
# off and who turns it on.
migrate = ["dep:somfy-migrate"]

[dev-dependencies]
# A dependency on this crate, from this crate, and it is deliberate: it is how
# a **non-default** feature is switched on for a package's own dev targets.
# Without it, `cargo test -p somfy-config`, `cargo clippy --workspace
# --all-targets` and `cargo doc --workspace` would each build the examples and
# integration tests with `migrate` off — at which point `tests/import.rs`
# compiles to nothing and the `provision_shades` example does not compile at
# all.
#
# The alternative was `required-features = ["migrate"]` on that example, and it
# was rejected for being quiet: cargo *skips* a target whose required features
# are absent, so the example and its tests would vanish from the default
# invocation without anything going red. That is the exact shape of CI hole
# this project keeps finding. A self dev-dependency instead makes the default
# invocation build, lint and test everything, while `cargo build` — which links
# no dev-dependencies — stays feature-free for the four bare-metal targets.
somfy-config = { path = ".", features = ["migrate"] }

# Both examples are listed explicitly for one reason: `test = true`, which is
# what makes `cargo test` run the unit tests inside them. Their mapping and
# refusal rules are pure logic — which shade kind a byte means, which backups
# are refused and why, and which pair of MQTT namespaces is one Home Assistant
# can read — and pure logic that no test reaches is pure logic nobody has
# checked.
#
# `provision` was found by autodiscovery until it grew the backup-import path,
# and autodiscovery does **not** imply `test = true`: the tests inside it
# compiled, passed when run by name, and were silently absent from
# `cargo test --workspace`. That is the shape of a CI hole this project keeps
# finding, so the entry is here rather than left implicit.
[[example]]
name = "provision_shades"
path = "examples/provision_shades/main.rs"
test = true

[[example]]
name = "provision"
path = "examples/provision.rs"
test = true
