[package]
name = "somfy-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed REST/WebSocket payloads for somfy-rs, with TypeScript generation for the UI"

[features]
ts = ["dep:ts-rs", "std"]
std = []

[dependencies]
serde = { version = "1", default-features = false, features = ["derive"] }
heapless = { version = "0.8", features = ["serde"] }
somfy-domain = { path = "../somfy-domain" }
# The settings DTOs convert straight into the validated types the flash record
# is decoded through, so a value this API accepts is one the region can hold.
# Doing that here rather than in the firmware is what makes the R3 rejection
# rules — "refused at the point of entry with the field named" — testable on the
# host, which is where every other rule in this workspace is checked.
somfy-config = { path = "../somfy-config" }
# Only for the namespace rules' error type, which `somfy-config` re-raises
# rather than flattens; `topic_rejection` matches it exhaustively.
somfy-mqtt = { path = "../somfy-mqtt" }
ts-rs = { version = "10", optional = true }

[dev-dependencies]
serde_json = "1"
# The *device's* JSON driver, as a dev-dependency only.
#
# `serde_json` proves a `Deserialize` impl is self-consistent; it does not prove
# the firmware can read the bytes, because the firmware never links it. Every
# body on this API arrives through picoserve's `Json` extractor, which is
# `serde-json-core` — the same 0.6 the firmware pins. The two drivers differ in
# ways the hand-written impls here are exposed to: `serde-json-core` supports no
# `deserialize_any` at all, and its `from_slice` reports how much it consumed
# rather than insisting it reached the end.
#
# `tests/calibration.rs` parses through both, and the calibration steps are why:
# `POST /shades/{id}/calibrate` had never been driven by anything but the
# TypeScript mock, which uses neither.
serde-json-core = { version = "0.6", default-features = false }
