[package]
name = "somfy-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed REST/WebSocket payloads for somfy-rs, with TypeScript generation for the UI"

[features]
ts = ["dep:ts-rs", "std"]
std = []

[dependencies]
serde = { version = "1", default-features = false, features = ["derive"] }
heapless = { version = "0.8", features = ["serde"] }
somfy-domain = { path = "../somfy-domain" }
somfy-rts = { path = "../somfy-rts" }
ts-rs = { version = "10", optional = true }

[dev-dependencies]
serde_json = "1"
