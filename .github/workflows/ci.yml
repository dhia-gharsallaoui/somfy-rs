name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy (somfy-api ts feature — covers the ts-only export code)
        run: cargo clippy -p somfy-api --features ts --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: release-mode tests (catch overflow/debug-assert divergence)
        run: cargo test -p somfy-domain --release --lib
      - name: TypeScript bindings up to date
        run: |
          cargo test -p somfy-api --features ts
          # `git add -N` surfaces newly generated (untracked) bindings so a new
          # DTO without a committed .ts also trips the diff, not just edits.
          git add -N ui/src/api/generated
          git diff --exit-code ui/src/api/generated
      - name: no_std check
        run: |
          rustup target add thumbv7em-none-eabihf
          cargo build -p somfy-rts --target thumbv7em-none-eabihf
          cargo build -p somfy-domain --target thumbv7em-none-eabihf
          cargo build -p somfy-api --target thumbv7em-none-eabihf
          cargo build -p somfy-migrate --target thumbv7em-none-eabihf
          cargo build -p somfy-rmt --target thumbv7em-none-eabihf
          cargo build -p somfy-cc1101 --target thumbv7em-none-eabihf
          cargo build -p somfy-store --target thumbv7em-none-eabihf
          cargo build -p somfy-tasks --target thumbv7em-none-eabihf
          cargo build -p somfy-mqtt --target thumbv7em-none-eabihf
          cargo build -p somfy-config --target thumbv7em-none-eabihf
          cargo build -p somfy-ota --target thumbv7em-none-eabihf
      - name: docs (deny broken intra-doc links)
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links"
        run: cargo doc --workspace --no-deps

  # The UI half of the wire contract. The `host` job proves the committed
  # bindings match the Rust DTOs; this job proves the UI and its mock still
  # compile against those bindings. Without it, a DTO change could regenerate
  # cleanly, pass the diff gate, and still leave the mock describing a device
  # the firmware no longer is.
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: typecheck (the drift gate — the mock is typed by the generated DTOs)
        run: bun run typecheck
      - run: bun run lint
      - run: bun run build
      - name: bundle size against the 200 KB gzipped budget (design spec §8)
        run: bun run size

  # Three chips × five service features is a large space, and this builds nine
  # of it. The choice is deliberate, because *silent* partial coverage is the
  # thing this project keeps being bitten by — five CI holes so far, every one
  # of them a configuration nobody built.
  #
  # What each row buys:
  #
  # - **The shipping build, per chip.** What a user flashes.
  # - **Radio only, per chip.** The structural test: if the core compiles with
  #   every service off, then no transport logic leaked into `somfy-domain`,
  #   `somfy-tasks`, `edits` or the state task. It found two couplings the first
  #   time it was run, and both were fixed rather than gated — see
  #   `crates/firmware/Cargo.toml`.
  # - **`http` alone, on one chip.** `ui` off *and* `mqtt` off at once, and now
  #   `mdns` and `sntp` off as well — which is what proves the web server is
  #   separable from the thing that advertises it, not merely optional together
  #   with it.
  # - **`mdns` alone, on one chip.** It pulls `http` in with it and nothing else,
  #   so this is the row that proves the responder does not depend on `ui` or on
  #   a broker — and it is the only row that builds `edge-mdns` without
  #   `picoserve`'s UI routes beside it.
  # - **`sntp` alone, on one chip.** The strongest of the structural rows,
  #   because `sntp` implies *nothing*: it builds the resolver, the socket
  #   accounting in `net::SOCKETS` and the wall clock with no other network
  #   service in the image at all.
  #
  # What is deliberately not covered, and why:
  #
  # - **The ESP32 with `http`, `ui`, `mdns` or `sntp`.** The first three cannot
  #   be built at all — `mdns` implies `http`, and `http` on that chip leaves
  #   54,556 bytes of DRAM for a 66,280-byte stack budget, so the image does not
  #   link. `sntp` *would* link and is refused anyway, because it leaves 872
  #   bytes of heap inside a ~4,216-byte spread. Both refusals are
  #   `compile_error!`s in `heap.rs` naming their measurements, and both were
  #   proved by hand rather than by a job, because a CI step whose success is a
  #   compilation *failure* inverts every other row here.
  # - **Feature interactions on the ESP32-C3.** They are architecture-
  #   independent — the same modules, the same statics — and the ESP32-S3 rows
  #   cover them. What the C3 is in the matrix *for* is the RISC-V code path,
  #   which its two rows exercise; note that its shipping row does build
  #   `edge-mdns`, `domain` and `sntpc` for RISC-V, which is the part that could
  #   plausibly differ.
  # - **`ui` without `mqtt` as its own row.** The shipping build covers `ui` on
  #   and the `http` row covers it off, so the module selection in `api/mod.rs`
  #   is exercised both ways already.
  # - **`mdns` and `sntp` together without `mqtt`.** They share nothing but
  #   `net::SOCKETS`, which every row's `StackResources<SOCKETS>` already sizes,
  #   and the shipping row builds both.
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The ESP32 tops out at MQTT; see the note above.
          - label: esp32 (mqtt)
            target: xtensa-esp32-none-elf
            args: --no-default-features --features chip-esp32,mqtt
          - label: esp32 (radio only)
            target: xtensa-esp32-none-elf
            args: --no-default-features --features chip-esp32
          - label: s3 (mqtt + ui + mdns + sntp)
            target: xtensa-esp32s3-none-elf
            args: --features chip-s3
          - label: s3 (http, no ui, no mqtt, no mdns, no sntp)
            target: xtensa-esp32s3-none-elf
            args: --no-default-features --features chip-s3,http
          - label: s3 (mdns only — pulls http, nothing else)
            target: xtensa-esp32s3-none-elf
            args: --no-default-features --features chip-s3,mdns
          - label: s3 (sntp only — pulls nothing)
            target: xtensa-esp32s3-none-elf
            args: --no-default-features --features chip-s3,sntp
          - label: s3 (radio only)
            target: xtensa-esp32s3-none-elf
            args: --no-default-features --features chip-s3
          - label: c3 (mqtt + ui + mdns + sntp)
            target: riscv32imc-unknown-none-elf
            args: --features chip-c3
          - label: c3 (radio only)
            target: riscv32imc-unknown-none-elf
            args: --no-default-features --features chip-c3
    steps:
      - uses: actions/checkout@v4
      - uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32,esp32s3
          ldproxy: false
      # The web UI is embedded in the image with `include_bytes!`, so
      # `crates/firmware/build.rs` needs `ui/dist/` to exist — and it is a build
      # artefact, not a tracked file. Without this step every row carrying `ui`
      # fails at the build script with "there is no ../../ui/dist/ to embed",
      # which is the right message and the wrong place to meet it.
      #
      # Run for every row rather than only the `ui` ones: it is a few seconds,
      # and a conditional here would be one more configuration-dependent thing
      # to get wrong. `build.rs` skips the embedding entirely when `ui` is off
      # (it checks `CARGO_FEATURE_UI`), so the rows that do not need this are
      # not made to wait for it either — the cost is the bun install, not a
      # dependency.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: build the web UI (embedded by build.rs)
        working-directory: ui
        run: |
          bun install --frozen-lockfile
          bun run build
      # The root `cargo fmt --check` above does NOT cover this crate: it is
      # excluded from the root workspace (it builds only for ESP targets), and
      # `--all` only reaches workspace members. So formatting drifted here
      # unnoticed. It is in the matrix job rather than the host one because
      # `rustfmt` has to come from the `esp` toolchain this crate pins.
      - name: fmt (${{ matrix.label }})
        working-directory: crates/firmware
        run: cargo fmt --check
      - name: clippy (${{ matrix.label }})
        working-directory: crates/firmware
        # No --all-targets here (unlike the host job above): this crate is a
        # no_std/no_main binary-only target, and --all-targets forces cargo to
        # also build an implicit unittest harness for the [[bin]] regardless
        # of `test = false` in Cargo.toml. That harness links std/libtest,
        # which no bare-metal target here ever provides, so --all-targets
        # fails unconditionally for this crate — confirmed independent of
        # feature/dependency choices. Plain clippy already covers the bin.
        #
        # Clippy runs on the dev profile and the build below on release, so a
        # green build does not imply a green lint — the ESP32 lint was silently
        # red for three tasks that way.
        run: cargo clippy ${{ matrix.args }} --target ${{ matrix.target }} -- -D warnings
      - name: build (${{ matrix.label }})
        working-directory: crates/firmware
        run: cargo build ${{ matrix.args }} --target ${{ matrix.target }} --release
